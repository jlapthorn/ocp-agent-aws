# Local Storage Operator
#
# LSO turns the raw /dev/sdc (nvme2n1) on each storage node into a
# PersistentVolume that ODF can consume. On platform: none there is no cloud
# volume provisioner, so this is the supported route to local block devices.
#
#   oc apply -f 01-lso-operator.yaml
#   oc get csv -n openshift-local-storage -w     # wait for Succeeded

apiVersion: v1
kind: Namespace
metadata:
  name: openshift-local-storage
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: local-operator-group
  namespace: openshift-local-storage
spec:
  targetNamespaces:
    - openshift-local-storage
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: local-storage-operator
  namespace: openshift-local-storage
spec:
  channel: stable               # LSO tracks a single `stable` channel
  name: local-storage-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
