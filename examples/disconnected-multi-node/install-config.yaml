apiVersion: v1
metadata:
  name: ocp                          # Cluster name — used in DNS records
baseDomain: example.com              # Your Route 53 hosted zone domain
networking:
  networkType: OVNKubernetes
  machineNetwork:
    - cidr: 10.0.1.0/24              # Must match your VPC subnet CIDR
  clusterNetwork:
    - cidr: 10.128.0.0/14
      hostPrefix: 23
  serviceNetwork:
    - 172.30.0.0/16
compute:
  - architecture: amd64
    hyperthreading: Enabled
    name: worker
    replicas: 3                      # 3 worker nodes
controlPlane:
  architecture: amd64
  hyperthreading: Enabled
  name: master
  replicas: 3                        # 3 control plane nodes (etcd quorum)
platform:
  none: {}                           # Required for agent-based install on EC2
imageContentSources:                 # Mirror registry mappings (from IDMS output)
  - mirrors:
    - 10.0.1.50:5000/openshift/release-images
    source: quay.io/openshift-release-dev/ocp-release
  - mirrors:
    - 10.0.1.50:5000/openshift/release
    source: quay.io/openshift-release-dev/ocp-v4.0-art-dev
additionalTrustBundle: |             # Self-signed CA from mirror registry
  -----BEGIN CERTIFICATE-----
  <paste your registry CA certificate here>
  -----END CERTIFICATE-----
pullSecret: 'YOUR_MERGED_PULL_SECRET' # Must include mirror registry credentials
sshKey: 'ssh-ed25519 AAAA...'        # Your public SSH key
